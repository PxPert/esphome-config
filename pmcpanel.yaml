esphome:
  name: pmcpanel
  friendly_name: PMCPanel
  includes:
    - includes/pmc_led_effects.h

esp8266:
  board: esp01_1m

# Enable logging
logger:
  level: VERBOSE
#  baud_rate: 115200
  baud_rate: 0

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  password: !secret ota_pwd_sec
  platform: esphome

wifi:
  ssid: !secret wifi_dmz_ssid
  password: !secret wifi_dmz_password
  use_address: 192.168.2.107

web_server:
  port: 80

time:
#  - platform: homeassistant
#    id: homeassistant_time
#    timezone: "Europe/Rome"
  - platform: sntp
    id: homeassistant_time
    timezone: Europe/Rome
    servers:
     - 192.168.2.1

#mqtt:
#  id: mqtt_client
#  broker: !secret mqtt_server
#  username: !secret mqtt_user
#  password: !secret mqtt_pwd
#  discovery: false
#  client_id: ${name}
##  log_topic: null

power_supply:
  - id: 'lights_power_supply'
    pin:
      number: 2
      inverted: true
      
switch:
#  - platform: gpio
#    pin: GPIO2
#    inverted: True
#    name: "Light Switch"
  - platform: gpio
    pin: 
      allow_other_uses: True
      number: 0
    name: "PixelControlLight0"
    inverted: True

  - platform: gpio
    pin: 
      allow_other_uses: True
      number: 3
    inverted: True
    name: "PixelControlLight1"

    
light:
  - platform: neopixelbus
    type: BRG
    variant: WS2811
    power_supply: lights_power_supply
    pin: 
      allow_other_uses: True
      number: 0
    
    num_leds: 194
    name: "Signboard Leds"
    id: light0
    effects: 
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.5s
          update_interval: 0.5s
          min_brightness: 0%
          max_brightness: 100%
      - addressable_rainbow:
          name: Rainbow Effect With Custom Values
          speed: 10
          width: 50    
      - addressable_lambda:
          name: "Broken Neon"
          update_interval: 300ms
          lambda: |-
            broken_neon(it, current_color, initial_run);
      - addressable_lambda:
          name: "Broken Letters"
          update_interval: 300ms
          lambda: |-
            broken_letters(it, current_color, initial_run);
      - addressable_lambda:
          name: "Broken Words"
          update_interval: 300ms
          lambda: |-
            broken_words(it, current_color, initial_run);

      - addressable_lambda:
          name: "Neon Startup"
          update_interval: 16ms
          lambda: |-
            neon_startup(it, current_color, initial_run);

      - addressable_lambda:
          name: "Single LED"
          update_interval: 1s
          lambda: |-
            single_led(it, current_color, initial_run);

      - addressable_lambda:
          name: "Single Letter"
          update_interval: 1s
          lambda: |-
            single_letter(it, current_color, true);

      - addressable_lambda:
          name: "Single Word"
          update_interval: 1s
          lambda: |-
            single_word(it, current_color, true);

      - addressable_lambda:
          name: "Words Animation 1"
          update_interval: 1000ms
          lambda: |-
            words_effect_1(it, current_color, initial_run);

      - addressable_lambda:
          name: "Letters Animation 1"
          update_interval: 500ms
          lambda: |-
            letter_effect_1(it, current_color, initial_run);

      - addressable_lambda:
          name: "Letters Animation 2"
          update_interval: 250ms
          lambda: |-
            letter_effect_2(it, current_color, initial_run);

      - addressable_lambda:
          name: "Pixels Animation 2"
          update_interval: 33ms
          lambda: |-
            pixel_effect_1(it, current_color, initial_run);

  - platform: neopixelbus
    type: GRB
    variant: WS2811
    power_supply: lights_power_supply
    internal: True
    pin: 
      allow_other_uses: True
      number: 3
    method:
      type: bit_bang
    num_leds: 62
    name: "Clock Leds"
    id: light1
#    effects: 
#      - pulse:
#          name: "Fast Pulse"
#          transition_length: 0.5s
#          update_interval: 0.5s
#          min_brightness: 0%
#          max_brightness: 100%
#      - addressable_rainbow:
#          name: Rainbow Effect With Custom Values
#          speed: 10
#          width: 50
#      - addressable_lambda:
#          name: "Single LED"
#          update_interval: 1s
#          lambda: |-
#            single_led(it, current_color, initial_run);

  - platform: partition
    name: "Internal ring"
    segments:
      - id: light1
        from: 0
        to: 7
    effects: 
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.5s
          update_interval: 0.5s
          min_brightness: 0%
          max_brightness: 100%

  - platform: partition
    name: "External ring"
    segments:
      - id: light1
        from: 8
        to: 45
    effects: 
      - addressable_rainbow:
          name: Rainbow
          speed: 10
          width: 50
      - addressable_color_wipe:
          name: Color Wipe White
          colors:
            - red: 100%
              green: 100%
              blue: 100%
              num_leds: 9
              gradient: true
            - red: 0%
              green: 0%
              blue: 0%
              num_leds: 1
              gradient: false
          add_led_interval: 100ms
          reverse: true
      - addressable_color_wipe:
          name: Color Wipe Color
          colors:
            - random: true
              num_leds: 5
              gradient: true
            - red: 0%
              green: 0%
              blue: 0%
              num_leds: 1
          add_led_interval: 100ms
          reverse: true
      - addressable_scan:
          name: Scan
          move_interval: 100ms
          scan_width: 3
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.5s
          update_interval: 0.5s
          min_brightness: 0%
          max_brightness: 100%
      - addressable_lambda:
          name: "Single LED"
          update_interval: 1s
          lambda: |-
            single_led(it, current_color, initial_run);
      - addressable_lambda:
          name: "Current Time"
          update_interval: 1s
          lambda: |-
            current_time_external_ring(it, current_color, initial_run);
  - platform: partition
    name: "Clock numbers"
    segments:
      - id: light1
        from: 46
        to: 57
    effects: 
      - addressable_color_wipe:
          name: Color Wipe 1
          colors:
            - red: 50%
              green: 0%
              blue: 0%
              num_leds: 11
              gradient: True
            - red: 0%
              green: 0%
              blue: 0%
              num_leds: 1
          add_led_interval: 80ms
          reverse: false
      - addressable_color_wipe:
          name: Color Wipe 2
          colors:
            - red: 50%
              green: 0%
              blue: 0%
              num_leds: 1
              gradient: False
            - red: 0%
              green: 0%
              blue: 0%
              num_leds: 11
          add_led_interval: 1000ms
          reverse: false
      - addressable_color_wipe:
          name: Color Wipe 3
          colors:
            - red: 50%
              green: 0%
              blue: 0%
              num_leds: 1
              gradient: false
            - red: 0%
              green: 0%
              blue: 0%
              num_leds: 3
          add_led_interval: 500ms
          reverse: false
      - addressable_color_wipe:
          name: Color Wipe 4
          colors:
            - red: 50%
              green: 0%
              blue: 0%
              num_leds: 1
              gradient: false
            - red: 0%
              green: 0%
              blue: 0%
              num_leds: 5
          add_led_interval: 1000ms
          reverse: false
      - addressable_color_wipe:
          name: Color Wipe 5
          colors:
            - red: 50%
              green: 0%
              blue: 0%
              num_leds: 1
              gradient: false
            - red: 0%
              green: 0%
              blue: 0%
              num_leds: 1
          add_led_interval: 500ms
          reverse: false
      - addressable_scan:
          name: Scan
          move_interval: 500ms
          scan_width: 1
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.5s
          update_interval: 0.5s
          min_brightness: 0%
          max_brightness: 100%
      - addressable_lambda:
          name: "Single LED"
          update_interval: 1s
          lambda: |-
            single_led(it, current_color, initial_run);
      - addressable_lambda:
          name: "Current Time"
          update_interval: 1s
          lambda: |-
            current_time_numbers(it, current_color, initial_run);
number:
  - platform: template
    id: selected_led_idx
    name: "Selected LED"
    optimistic: true
    min_value: 0
    max_value: 193
    step: 1
    
button:
  - platform: safe_mode
    name: "Safe Mode Restart"
  - platform: restart
    name: "Restart"
