substitutions:
  name: garage-assistant
  friendly_name: Garage Assistant

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: m5stack-atom
  
  framework:
    type: esp-idf
    version: 6.0.2
    advanced:
      enable_ota_rollback: false
      sram1_as_iram: true
      minimum_chip_revision: "1.1"
logger:
  level: INFO
  task_log_buffer_size: 0B
  tx_buffer_size: 160B
  
api:

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_pwd_sec

wifi:
  networks:
#  - ssid: !secret wifi_dmz_ssid
#    password: !secret wifi_dmz_password
#  use_address: 192.168.2.186
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
##  use_address: 192.168.1.99
#  ap:

#captive_portal:

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO33
    i2s_bclk_pin: GPIO19

