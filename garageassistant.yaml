substitutions:
  name: garage-assistant
  friendly_name: Garage Assistant

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  libraries:
    - BluetoothA2DPSink=https://github.com/PxPert/ESP32-A2DP
#  platformio_options:
#    build_flags: 
#      - -DUSE_DEFAULT_STDLIB
#      - -DUSE_IDF_LOGGER
#      - -DEXIT_ON_STOP

mdns:
  disabled: true
  
debug:
  update_interval: 10s
  
esp32:
  board: m5stack-atom
  
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BT_ENABLED: y
      CONFIG_BT_BLE_ENABLED: n
      CONFIG_BT_GATTS_ENABLE: n
      CONFIG_BT_CLASSIC_ENABLED: y
      CONFIG_BT_A2DP_ENABLE: y
      CONFIG_BT_SPP_ENABLED: y
      CONFIG_BT_HFP_ENABLE: n
      CONFIG_BT_HID_ENABLED: n
      CONFIG_BT_BLUEDROID_ENABLED: y
      CONFIG_BT_NIMBLE_ENABLED: n
#      CONFIG_BTDM_CTRL_MODE_BTDM: y
      CONFIG_BT_AVRCP_CT_COVER_ART_ENABLED: n
      CONFIG_BTDM_CTRL_MODE_BR_EDR_ONLY: y
      CONFIG_BTDM_CTRL_BR_EDR_MAX_ACL_CONN: "1"
      CONFIG_BT_ACL_CONNECTIONS: "1"
      CONFIG_BT_ALARM_MAX_NUM: "20"   # default 50
      
#      CONFIG_BT_BTU_TASK_STACK_SIZE: "3072"   # default 4096
      CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM: "6"      # default 10
      CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM: "16"    # default 32
      CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM: "16"    # default 32
      CONFIG_ESP32_WIFI_TX_BUFFER_TYPE: "1"            # dynamic
      CONFIG_LWIP_MAX_SOCKETS: "6"          # default 10
      CONFIG_LWIP_TCP_MSS: "1440"
      CONFIG_LWIP_MAX_ACTIVE_TCP: "8"      # default 16
      CONFIG_LWIP_MAX_LISTENING_TCP: "4"   # default 16
      CONFIG_LWIP_MAX_UDP_PCBS: "6"        # default 16 (mDNS/DHCP/SNTP)
      CONFIG_LWIP_MAX_RAW_PCBS: "2"        # default 16, quasi mai usati
      CONFIG_TCP_SND_BUF_DEFAULT: "5744"    # default ~5760, marginale
      CONFIG_TCP_WND_DEFAULT: "5744"
      CONFIG_ESP32_WIFI_MGMT_SBUF_NUM: "16"
      # Disabilita il protocollo SSL/TLS (mantiene solo le primitive crypto per WiFi)
#      CONFIG_MBEDTLS_TLS_DISABLED: y
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE: n
#      CONFIG_MBEDTLS_TLS_SERVER_AND_CLIENT: n
      CONFIG_MBEDTLS_KEY_EXCHANGE_RSA: y
      CONFIG_MBEDTLS_KEY_EXCHANGE_ELLIPTIC_CURVE: n
      CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA: n
      CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA: n
      CONFIG_MBEDTLS_KEY_EXCHANGE_ECDH_ECDSA: n
      CONFIG_MBEDTLS_KEY_EXCHANGE_ECDH_RSA: n
      CONFIG_MBEDTLS_SSL_ALPN: n
      CONFIG_MBEDTLS_SSL_RENEGOTIATION: n
      CONFIG_MBEDTLS_CLIENT_SSL_SESSION_TICKETS: n
      CONFIG_MBEDTLS_SERVER_SSL_SESSION_TICKETS: n
      CONFIG_MBEDTLS_PEM_PARSE_C: n
      CONFIG_MBEDTLS_PEM_WRITE_C: n
      CONFIG_MBEDTLS_X509_CRL_PARSE_C: n
      CONFIG_MBEDTLS_X509_CSR_PARSE_C: n
      CONFIG_ESP_HTTP_CLIENT_ENABLE_HTTPS: n
      
#    version: 6.0.2
    advanced:
      enable_ota_rollback: false
      sram1_as_iram: true
      minimum_chip_revision: "1.1"
      
logger:
  level: INFO
  task_log_buffer_size: 0B
  tx_buffer_size: 160B
  
api:

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_pwd_sec

external_components:
  - source: /config/components/
    components: [ a2dp_sink ]
    
wifi:
  networks:
#  - ssid: !secret wifi_dmz_ssid
#    password: !secret wifi_dmz_password
#  use_address: 192.168.2.186
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
