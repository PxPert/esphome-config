esphome:
  name: lettorecd
  friendly_name: Lettore CD
  
esp8266:
  board: esp12e

# Enable logging
logger:
  level: DEBUG
  baud_rate: 0

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  password: !secret ota_pwd
  id: my_ota
  platform: esphome

wifi:
  ssid: !secret wifi_dmz_ssid
  password: !secret wifi_dmz_password
  use_address: 192.168.2.17

mqtt:
  id: mqtt_client
  broker: !secret mqtt_server
  username: !secret mqtt_user
  password: !secret mqtt_pwd
  discovery: false
  client_id: ${name}
#  log_topic: null

external_components:
  - source: /config/components/
    components: [ atapi ]

captive_portal:
    
i2c:
  scan: False
  frequency: 400kHz
#  sda: GPIO5
#  scl: GPIO4

font:
  - file: "gfonts://Roboto"
    id: roboto_20
    size: 20

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    # show_test_card: true
    lambda: |-
      it.print(0, 0, id(roboto_20), "Hello World!");
#      it.filled_rectangle(0, 0, 128, 64);

atapi:
  id: cd_reader

#  frequency: 500kHz

# font:
#   - file: 'fonts/LiberationMono-Regular.ttf'
#     id: font3
#     size: 14

# display:
#   - platform: ssd1306_i2c
#     model: "SSD1306 128x32"
#     address: 0x3C
#     invert: True
#     lambda: |-
#       it.printf(0, 0,id(font3),"Numero: %d",123);
binary_sensor:
  - platform: gpio
    internal: True
    name: "Play Pause"
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - lambda: |-
          id(cd_reader).enqueue_play();
  - platform: gpio
    internal: True
    name: "Stop Eject"
    pin:
      number: GPIO2
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - lambda: |-
          id(cd_reader).enqueue_stop();
  - platform: gpio
    internal: True
    name: "Next track"
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - lambda: |-
          id(cd_reader).enqueue_next();
  - platform: gpio
    internal: True
    name: "Previous track"
    pin:
      number: GPIO14
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - lambda: |-
          id(cd_reader).enqueue_previous();

output:
  - platform: esp8266_pwm
    pin: GPIO13
    id: pwm_led

light:
  - platform: monochromatic
    name: "Device led"
    output: pwm_led
    internal: True
    id: light_led
    restore_mode: ALWAYS_ON
    effects:
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.1s
          update_interval: 0.1s
          min_brightness: 0%
          max_brightness: 70%
      - pulse:
          name: "Slow Pulse"
          transition_length: 5s
          update_interval: 5s
          min_brightness: 20%
          max_brightness: 50%
      - pulse:
          name: "Blink"
          transition_length: 0s
          update_interval: 0.3s
          min_brightness: 0%
          max_brightness: 100%

remote_receiver:
  pin: 
    number: GPIO12
    inverted: True
  dump: all

button:
  - platform: safe_mode
    name: "Restart (Safe Mode)"
  - platform: restart
    name: "Restart"
  - platform: template
    name: Reset IDE Device
    id: reset_device
    on_press:
      - logger.log: Reset device request
      - lambda: |-
          id(cd_reader).reset_all();
  - platform: template
    name: Play
    id: play
    on_press:
      - logger.log: Play request
      - lambda: |-
          id(cd_reader).enqueue_play();
  - platform: template
    name: Stop
    id: stop
    on_press:
      - logger.log: Stop request
      - lambda: |-
          id(cd_reader).enqueue_stop();
  - platform: template
    name: Eject
    id: eject
    on_press:
      - logger.log: Eject request
      - lambda: |-
          id(cd_reader).enqueue_eject();
  - platform: template
    name: Load
    id: load
    on_press:
      - logger.log: Load request
      - lambda: |-
          id(cd_reader).enqueue_load();
  - platform: template
    name: Pause
    id: pause_
    on_press:
      - logger.log: Pause request
      - lambda: |-
          id(cd_reader).enqueue_pause();
  - platform: template
    name: Resume
    id: resume
    on_press:
      - logger.log: Resume request
      - lambda: |-
          id(cd_reader).enqueue_resume();
  - platform: template
    name: Stop Disc
    id: stop_disc
    on_press:
      - logger.log: Stop disc request
      - lambda: |-
          id(cd_reader).enqueue_stop_disc();
  - platform: template
    name: Next
    id: next_track
    on_press:
      - logger.log: Next track request
      - lambda: |-
          id(cd_reader).enqueue_next();
  - platform: template
    name: Previous
    id: prev_track
    on_press:
      - logger.log: Previous track request
      - lambda: |-
          id(cd_reader).enqueue_previous();
  - platform: template
    name: Restart track
    id: restart_track
    on_press:
      - logger.log: Restart track request
      - lambda: |-
          id(cd_reader).enqueue_restart_track();
