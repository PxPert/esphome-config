button:
  - platform: safe_mode
    name: "Restart (Safe Mode)"
  - platform: restart
    name: "Restart"
  - platform: template
    name: Reset IDE Device
    id: reset_device
    on_press:
      - logger.log: Reset device request
      - lambda: |-
          // id(cd_reader).reset_all();
          id(cd_reader).enqueue_reset();
  - platform: template
    name: Play
    id: play
    on_press:
      - logger.log: Play request
      - lambda: |-
          id(cd_reader).enqueue_play();
  - platform: template
    name: Stop
    id: stop
    on_press:
      - logger.log: Stop request
      - lambda: |-
          id(cd_reader).enqueue_stop();
  - platform: template
    name: Eject
    id: eject
    on_press:
      - logger.log: Eject request
      - lambda: |-
          id(cd_reader).enqueue_eject();
  - platform: template
    name: Load
    id: load
    on_press:
      - logger.log: Load request
      - lambda: |-
          id(cd_reader).enqueue_load();
  - platform: template
    name: Pause
    id: pause_
    on_press:
      - logger.log: Pause request
      - lambda: |-
          id(cd_reader).enqueue_pause();
  - platform: template
    name: Resume
    id: resume
    on_press:
      - logger.log: Resume request
      - lambda: |-
          id(cd_reader).enqueue_resume();
  - platform: template
    name: Stop Disc
    id: stop_disc
    on_press:
      - logger.log: Stop disc request
      - lambda: |-
          id(cd_reader).enqueue_stop_disc();
  - platform: template
    name: Next
    id: next_track
    on_press:
      - logger.log: Next track request
      - lambda: |-
          id(cd_reader).enqueue_next();
  - platform: template
    name: Previous
    id: prev_track
    on_press:
      - logger.log: Previous track request
      - lambda: |-
          id(cd_reader).enqueue_previous();
  - platform: template
    name: Restart track
    id: restart_track
    on_press:
      - logger.log: Restart track request
      - lambda: |-
          id(cd_reader).enqueue_restart_track();
