binary_sensor:
  - platform: gpio
    internal: True
    name: "Play Pause"
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - script.execute: play_pause
          
  - platform: gpio
    internal: True
    name: "Stop Eject"
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - script.execute: stop_eject

# Fast Forward
  - platform: gpio
    internal: True
    name: "Fast Forward"
    id: btn_fast_forward
    pin:
      number: GPIO14
      mode: INPUT_PULLUP
      inverted: true
    filters:
    - lambda: |-
        if (id(cd_reader).can_enqueue(true)) {
          return x;
        } else {
          return {};
        };

    on_release:
      then:
        - logger.log: "FF release"
        - script.execute: handle_seek_release
    on_multi_click:
    - timing:
        - ON for at most 500ms
      then:
        - logger.log: "Normal click"
        - script.execute:
            id: set_seek_type
            seek_type: '2'
            force: false
        - script.wait: set_seek_type
        - script.execute:
            id: set_seek_value
            direction: '1'
            press_duration: 0

    - timing:
        - ON for at least 1000ms
      then:
        - logger.log: "Long click"
        - script.execute:
            id: set_seek_type
            seek_type: '3'
            force: false
        - script.wait: set_seek_type
        - lambda: |-
            id(seek_long_press_time) = millis();
        - while:
            condition:
              binary_sensor.is_on: btn_fast_forward
            then:
            - logger.log: "Still executing"
            - script.execute:
                id: set_seek_value
                direction: '1'
                press_duration: !lambda "return id(seek_long_press_time);"
            - delay: 500ms

# Rewind
  - platform: gpio
    internal: True
    name: "Rewind"
    id: btn_rewind
    pin:
      number: GPIO2
      mode: INPUT_PULLUP
      inverted: true
    filters:
    - lambda: |-
        if (id(cd_reader).can_enqueue(true)) {
          return x;
        } else {
          return {};
        };

    on_release:
      then:
        - logger.log: "Rewind release"
        - script.execute: handle_seek_release
    on_multi_click:
    - timing:
        - ON for at most 500ms
      then:
        - logger.log: "Normal click"
        - script.execute:
            id: set_seek_type
            seek_type: '2'
            force: false
        - script.wait: set_seek_type
        - script.execute:
            id: set_seek_value
            direction: '-1'
            press_duration: 0

    - timing:
        - ON for at least 1000ms
      then:
        - logger.log: "Long click"
        - script.execute:
            id: set_seek_type
            seek_type: '3'
            force: false
        - script.wait: set_seek_type
        - lambda: |-
            id(seek_long_press_time) = millis();
        - while:
            condition:
              binary_sensor.is_on: btn_rewind
            then:
            - logger.log: "Still executing"
            - script.execute:
                id: set_seek_value
                direction: '-1'
                press_duration: !lambda "return id(seek_long_press_time);"
            - delay: 500ms

output:
  - platform: esp8266_pwm
    pin: GPIO13
    id: pwm_led

light:
  - platform: monochromatic
    name: "Device led"
    output: pwm_led
    internal: True
    id: light_led
    restore_mode: ALWAYS_ON
    effects:
      - pulse:
          name: "Loading"
          transition_length: 0.1s
          update_interval: 0.1s
          min_brightness: 0%
          max_brightness: 70%
      - pulse:
          name: "Playing"
          transition_length: 5s
          update_interval: 5s
          min_brightness: 20%
          max_brightness: 50%
      - pulse:
          name: "Error"
          transition_length: 0s
          update_interval: 0.3s
          min_brightness: 0%
          max_brightness: 100%

