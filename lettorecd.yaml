button:
  - platform: safe_mode
    name: "Restart (Safe Mode)"
  - platform: restart
    name: "Restart"
  - platform: template
    name: Reset IDE Device
    id: reset_device
    on_press:
      - logger.log: Reset device request
      - lambda: |-
          // id(cd_reader).reset_all();
          id(cd_reader).enqueue_reset();
  - platform: template
    name: Play/Pause
    id: play
    on_press:
      - logger.log: Play request
      - script.execute: play_pause
  - platform: template
    name: Stop/Eject
    id: stop
    on_press:
      - logger.log: Stop request
      - script.execute: stop_eject
