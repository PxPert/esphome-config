esphome:
  name: lettorecd
  friendly_name: Lettore CD
  
esp8266:
  board: esp12e

# Enable logging
logger:
  level: DEBUG
  baud_rate: 115200

# Enable Home Assistant API
# api:
#   encryption:
#     key: !secret api_key

ota:
  password: !secret ota_pwd
  id: my_ota
  platform: esphome

wifi:
  ssid: !secret wifi_dmz_ssid
  password: !secret wifi_dmz_password
  use_address: 192.168.2.17

mdns:
  disabled: true

mqtt:
  id: mqtt_client
  broker: !secret mqtt_server
  username: !secret mqtt_user
  password: !secret mqtt_pwd
  discovery: true
# #   client_id: cd_reader
# # #  log_topic: null

external_components:
  - source: /config/components/
    components: [ atapi, rc5x ]

rc5x:
  pin: 12
  on_press:
    lambda: |-
      ESP_LOGD("rc5x-yaml","IR Press From yaml. %d - %lu", t,x);
      switch (x) {
        case 1324298: // Play pause button
        case 1332992: // Enter button
          id(play_pause).execute();

        break;
        case 1324544: // Stop button
        case 1322240: // Eject button
          id(stop_eject).execute();
        break;
        case 1332736: // Right button
          id(seek_from_remote).execute(3,1, true);
        break;
        case 1332480: // Left button
          id(seek_from_remote).execute(3,-1, true);
        break;
        case 1318912: // Next button
        case 1331200: // Up button
          id(seek_from_remote).execute(2,1, true);
        break;
        case 1319168: // Previous button
        case 1331456: // Down button
          id(seek_from_remote).execute(2,-1, true);
        break;

        default:
          break;
      }
  on_release:
    then:
      lambda: |-
        switch (x) {
          case 1332736: // Right button
          case 1332480: // Left button
          case 1318912: // Next button
          case 1331200: // Up button
          case 1319168: // Previous button
          case 1331456: // Down button
            id(handle_seek_release).execute();
            break;
          default:
            break;
        }
        ESP_LOGD("rc5x-yaml","IR Release From yaml. %d - %lu", t,x);
#  id: remote_control
# captive_portal:
    
i2c:
  scan: False
  frequency: 400kHz
#  sda: GPIO5
#  scl: GPIO4

font:
#   - file: "gfonts://Roboto"
    # id: roboto_20
    # size: 20
  - file: 'fonts/LiberationMono-Regular.ttf'
    id: font_header
    size: 14

  - file: 'fonts/LiberationMono-Regular.ttf'
    id: font_body
    size: 24

    # webfonts from https://pictogrammers.com/
  - file: 'fonts/materialdesignicons-webfont.ttf'
    id: md_state_icons
    size: 40
    glyphs:
      - "\U000F01D1" # disc-alert
      - "\U000F040A" # play
      - "\U000F03E4" # pause
      - "\U000F04DB" # stop
      - "\U000F01EA" # eject
#      - "\U000F0453" # loading
      - "\U000F0028" # alert
      - "\U000F04AC" # skip-next
      - "\U000F0211" # fast-forward
      - "\U000F045F" # rewind
      - "\U000F04AB" # skip-previous

#      - "\U000" # 
    
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    id: lcd_display
    # show_test_card: true
    lambda: |-
      // Icon
      const char* disc_icon = "\U000F01D1"; // No disc default icon
      if (id(cd_reader).status_has_error()) {
        disc_icon = "\U000F0028"; // Alert icon
      } else {
        switch (id(cd_reader).get_disc_state()) {
          case DISC_STATUS_NODISC:
            break;
          case DISC_STATUS_TRAY_OPENED:
            disc_icon = "\U000F01EA"; // Tray opened icon
            break;
          default:
            if (id(requested_seek_type) == 2) {
              if (id(requested_seek_direction) > 0) {
                disc_icon = "\U000F04AC"; // Skip next icon
              } else {
                disc_icon = "\U000F04AB"; // Skip previous icon
              }
            } else {
              if (id(requested_seek_type) == 3) {
                if (id(requested_seek_direction) > 0) {
                  disc_icon = "\U000F0211"; // Fast forward icon
                } else {
                  disc_icon = "\U000F045F"; // Rewind icon
                }
              } else {
                switch (id(cd_reader).get_status()) {
                  case AUDIOSTATUS_PLAYING:
                    disc_icon = "\U000F040A"; // Play icon
                    break;
                  case AUDIOSTATUS_PAUSED:
                    disc_icon = "\U000F03E4"; // Pause icon
                    break;
                  default:
                    disc_icon = "\U000F04DB"; // Stop icon
                    break;
                }
              }
            }
            break;
        }
      }

      it.printf(0, 22, id(md_state_icons), TextAlign::TOP_LEFT,disc_icon);
      // Header
      switch (id(cd_reader).get_disc_state()) {
        case 0:
          it.print(0, 0, id(font_header), "No disc");
          break;
        case 1:
          it.printf(0, 0, id(font_header), "%02d:%02d",id(cd_reader).get_total_time() / 60, id(cd_reader).get_total_time() % 60 );
          if (id(cd_reader).get_status() > 1) {
            it.printf(it.get_width(), 0, id(font_header),TextAlign::TOP_RIGHT,"%02d:%02d",id(cd_reader).get_current_time() / 60, id(cd_reader).get_current_time() % 60);
          }
          break;
        case 2:
          it.print(0, 0, id(font_header), "Tray opened");
          break;
      }

      // Line separator
      it.line(0, 20, it.get_width(), 20);

      // Central track number & play time
      if (id(cd_reader).get_disc_state() == 1) {
        if (id(requested_seek_type) > 0) {
          // Show requested seek time / track
          it.printf(50, 28, id(font_body), "%02d/%02d", id(selected_track) + 1 ,id(cd_reader).get_tracks() );
          it.printf(65, 48, id(font_header),TextAlign::TOP_LEFT,"%02d:%02d", id(selected_time) / 60, id(selected_time) % 60);

        } else {
          it.printf(50, 28, id(font_body), "%02d/%02d", (id(cd_reader).get_status() > 1)?id(cd_reader).get_current_track() + 1:id(cd_reader).get_start_track() + 1,id(cd_reader).get_tracks() );
          if (id(cd_reader).get_status() > 1) {
            it.printf(65, 48, id(font_header),TextAlign::TOP_LEFT,"%02d:%02d",id(cd_reader).get_current_track_time() / 60, id(cd_reader).get_current_track_time() % 60);
          } else {
            it.print(65, 48, id(font_header),TextAlign::TOP_LEFT,"00:00");
          }

        }
      } else {
        it.print(50, 28, id(font_body), "--/--");
      }
        
atapi:
  id: cd_reader
  on_error:
    - component.update: lcd_display
    - script.execute: set_led_effect
#    - sensor.template.publish:
#        id: error_code
#        state: !lambda 'return x;'

  on_lock:
    - script.execute: set_led_effect
    - if:
        condition:
        - lambda: 'return x == BUSYSTATUS_NONE;'
        then:
        - globals.set:
            id: requested_seek_type
            value: '0'
    - component.update: lcd_display
#    - sensor.template.publish:
#        id: busy_state
#        state: !lambda 'return x;'


  on_update:
    - component.update: lcd_display
#    - sensor.template.publish:
#        id: song_duration
#        state: !lambda 'return id(cd_reader).get_track_duration(id(cd_reader).get_current_track());'
#    - sensor.template.publish:
#        id: current_track
#        state: !lambda 'return id(cd_reader).get_current_track();'
#    - sensor.template.publish:
#        id: current_position
#        state: !lambda 'return id(cd_reader).get_current_track_time();'
  on_toc:
    - component.update: lcd_display
#    - sensor.template.publish:
#        id: total_duration
#        state: !lambda 'return id(cd_reader).get_total_time();'
#    - sensor.template.publish:
#        id: total_tracks
#        state: !lambda 'return id(cd_reader).get_tracks();'
  on_state:
    - if:
        condition:
        - lambda: 'return id(cd_reader).get_status() == AUDIOSTATUS_NODISC;'
        then:
        - script.execute: reset_variables
    - component.update: lcd_display
    - script.execute: set_led_effect    
#    - sensor.template.publish:
#        id: audio_state
#        state: !lambda 'return x;'
#    - sensor.template.publish:
#        id: disc_state
#        state: !lambda 'return id(cd_reader).get_disc_state();'

globals:
  - id: seek_release_time
    type: unsigned long
    restore_value: no
    initial_value: '0'
  - id: seek_long_press_time
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: requested_seek_type
    type: int
    initial_value: '0'
    # 0 = no seek requested
    # 1 = seek/track selected. Request pending
    # 2 = seeking
    # 3 = track selecting
    restore_value: no

  - id: selected_track
    type: int8_t
    restore_value: no
    initial_value: '0'
  - id: selected_time
    type: uint16_t
    initial_value: '0'
    restore_value: no
  - id: requested_seek_direction
    type: int8_t
    initial_value: '0'
    restore_value: no

script: 
  - id: reset_variables
    then:
    - logger.log: "Reset variables"
    - globals.set:
        id: seek_release_time
        value: '0'
    - globals.set:
        id: seek_long_press_time
        value: '0'
    - globals.set:
        id: requested_seek_type
        value: '0'
    - globals.set:
        id: requested_seek_direction
        value: '0'

  - id: set_led_effect
    mode: restart
    then:
      - light.turn_on:
          id: light_led
          effect: !lambda |-
            return id(cd_reader).status_has_error() ?
              "Error"
            :
            ( id(cd_reader).get_busy_status() ?
                "Loading"
              :
              (  id(cd_reader).get_status() == 2 ?
                "Playing"
              :
              "none"
              )
            );
  - id: set_seek_type
    parameters:
      seek_type: int
      force: bool
    then:
      lambda: |-
        if (id(requested_seek_type) == 0) {
          id(selected_track) = (id(cd_reader).get_status() > 1)?id(cd_reader).get_current_track():id(cd_reader).get_start_track();
          id(selected_time) = (id(cd_reader).get_status() > 1)?id(cd_reader).get_current_track_time():0;
        }
        if ( (id(requested_seek_type) < 2) || (force) ) {
          id(requested_seek_type) = seek_type;
        }

  - id: seek_from_remote
    mode: restart
    parameters: 
      seek_type: int
      direction: int
      force_change_direction: bool
    then:
      - lambda: |-
          id(seek_long_press_time) = millis();
      - script.execute: 
          id: set_seek_type
          seek_type: !lambda "return seek_type;"
          force: !lambda "return force_change_direction;"
      - script.wait: set_seek_type
#      - script.execute:
#          id: set_seek_value
#          direction: !lambda "return direction;"
#          press_duration: !lambda "return id(seek_long_press_time);"
      - while:
          condition:
          - lambda: |-
              return id(seek_long_press_time);
          then:
          - logger.log: "Still executing"
          - script.execute:
              id: set_seek_value
              direction: !lambda "return direction;"
              press_duration: !lambda "return id(seek_long_press_time);"
          - delay: 500ms

  - id: handle_seek_release
    mode: restart
    then:
    - logger.log: "Release handle start"
    - lambda: |-
        id(seek_long_press_time) = 0;
        id(seek_release_time) = millis();
    - wait_until:
        condition:
          any:
            - binary_sensor.is_on: btn_fast_forward
            - binary_sensor.is_on: btn_rewind
            - lambda: |-
                return id(seek_long_press_time);
        timeout: 1s
    - if:
        condition:
          lambda: |-
            return  (millis() - id(seek_release_time)) > 900;
        then:
          - logger.log: "release Condition OK"
          - script.execute:
              id: perform_seek
        else:
          - logger.log:
              format: "release Condition KO: %lu - %lu"
              args: [ 'id(seek_release_time)', 'millis()' ]
  - id: play_pause
    mode: restart
    then:
      lambda: |-
        if (! id(cd_reader).can_enqueue(true)) {
          return;
        }
        if (id(cd_reader).get_device_ready() == 2) {
          if (id(cd_reader).get_status() == AUDIOSTATUS_PLAYING) {
            ESP_LOGD("cdreader-playpause", "Requesting pause");
            id(cd_reader).enqueue_pause();
          } else { 
            if (id(cd_reader).get_disc_state() == DISC_STATUS_DISC_PRESENT) {

              if (id(requested_seek_type)) {
                id(requested_seek_type) = 1;
                ESP_LOGD("cdreader-playpause", "Requesting play at specific position");
                id(cd_reader).enqueue_play_track(id(selected_track), id(selected_time));
              } else {
                if (id(cd_reader).get_status() == AUDIOSTATUS_PAUSED) {
                  ESP_LOGD("cdreader-playpause", "Requesting resume");
                  id(cd_reader).enqueue_resume();
                } else {
                  ESP_LOGD("cdreader-playpause", "Requesting play");
                  id(cd_reader).enqueue_play();
                }
                
              }
            }
          }
        } else {
          id(cd_reader).enqueue_reset();
        }

  - id: stop_eject
    mode: restart
    then:
      lambda: |-
        if (! id(cd_reader).can_enqueue(false)) {
          return;
        }
        if ((id(cd_reader).get_disc_state() == DISC_STATUS_NODISC) || (id(cd_reader).get_disc_state() == AUDIOSTATUS_NODISC)) {
          id(cd_reader).enqueue_eject();
          ESP_LOGD("cdreader-stopeject", "Requesting eject");
        } else {
          if (id(cd_reader).get_disc_state() == DISC_STATUS_TRAY_OPENED) {
            ESP_LOGD("cdreader-stopeject", "Closing tray");
            id(cd_reader).enqueue_load();
          } else {
            if ( (id(cd_reader).get_status() == AUDIOSTATUS_PLAYING) || (id(cd_reader).get_status() == AUDIOSTATUS_PAUSED)) {
              ESP_LOGD("cdreader-stopeject", "Requesting stop");
              id(cd_reader).enqueue_stop();
            } else {
              if (id(requested_seek_type) != 0) {
                id(requested_seek_type) = 0;
                id(selected_track) = 0;
                id(selected_time) = 0;
              } else {
                ESP_LOGD("cdreader-stopeject", "Requesting eject");
                id(cd_reader).enqueue_eject();
              }
            }
          }
        }


  - id: set_seek_value
    parameters: 
      direction: int
      press_duration: int
    then:
    - lambda: |-
        id(requested_seek_direction) = direction;
        ESP_LOGD("seek", "Requested direction: %d - press_duration: %d - Seek type: %d", direction, press_duration, id(requested_seek_type));
        if (id(requested_seek_type) == 2) {

          if (
            ( direction < 0 )
            &&
            ( 
              ( id(cd_reader).get_status() == AUDIOSTATUS_PLAYING )
              ||
              ( id(cd_reader).get_status() == AUDIOSTATUS_PAUSED )
            )
            &&
            ( id(selected_time) > 5 )
            &&
            ( id(cd_reader).get_current_track() == id(selected_track) )
          ) {
            direction = 0;
          }

          id(selected_time) = 0;
          id(selected_track) += 1 * direction;

        } else {
          uint8_t seek_rate = 5;
          ESP_LOGI("press","check press duration: %d",  press_duration);
          if (press_duration > 0) {
            ESP_LOGI("press","Press duration > 0: %d - %d",  press_duration, millis() - press_duration);
            if (millis() - press_duration > 10000) {
              seek_rate = 30;
            } else {
              if (millis() - press_duration > 5000) {
                seek_rate = 10;
              }
            }

          }
          id(selected_time) = id(selected_time) + (seek_rate * direction) - (id(selected_time) % seek_rate);
          if (id(selected_time) < 0) {
            if (id(selected_track) == id(cd_reader).get_start_track()) {
              id(selected_track) = id(cd_reader).get_tracks() - 1;
            } else {
              id(selected_track) -= 1;
            }
            id(selected_time) = id(cd_reader).get_track_duration( id(selected_track) ) - (id(cd_reader).get_track_duration( id(selected_track) ) % seek_rate);
          }

          if (id(selected_time) > id(cd_reader).get_track_duration( id(selected_track) ) - 1 ) {
            id(selected_track) += 1;
            id(selected_time) = 0;
          }
        }

        if (id(selected_track) == id(cd_reader).get_tracks()) {
          id(selected_track) = id(cd_reader).get_start_track();
        } else {
          if (id(selected_track) == id(cd_reader).get_start_track() - 1) {
            id(selected_track) = id(cd_reader).get_tracks() - 1;
          }
        }


    - component.update: lcd_display
    - logger.log:
        format: "Track value: %02d - Seek value: %02d"
        args: [ 'id(selected_track)', 'id(selected_time)' ]
        
  - id: perform_seek
    then:
    - logger.log:
        format: "Seek to track: %02d - position: %02d"
        args: [ 'id(selected_track)', 'id(selected_time)' ]
    - lambda: |-
        if (id(requested_seek_type) > 1) 
        {
          if ( id(cd_reader).get_status() == AUDIOSTATUS_PLAYING ) {
            id(cd_reader).enqueue_play_track(id(selected_track), id(selected_time));
          } else {
            id(requested_seek_type) = 1;
          }
          
        }
    - component.update: lcd_display

