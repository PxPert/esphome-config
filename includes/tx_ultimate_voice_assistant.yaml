  - platform: i2s_audio
    i2s_audio_id: audio_mic_i2s
    i2s_din_pin: ${mic_sdata_pin}
    adc_type: external
    id: asr_mic
    pdm: false

esp_adf:


voice_assistant:
  id: va
  microphone: asr_mic
  speaker: audio_out
#  media_player: media_out
#  micro_wake_word: mww
  vad_threshold: 5
  use_wake_word: false
  noise_suppression_level: 4
  auto_gain: 31dBFS
  volume_multiplier: 15.0
  on_stt_vad_start:
    - globals.set:
        id: va_capturing
        value: "true"
    - light.turn_on:
        id: leds
        red: 0
        green: 1
        blue: 0
        brightness: 1
#        effect: "Scan"
  on_wake_word_detected:
    - script.execute: sound_beep
    - globals.set:
        id: va_capturing
        value: "true"
    - light.turn_on:
        id: leds
        red: 0
        green: 0
        blue: 1
        brightness: 1
#        effect: "Scan"

#  on_stt_vad_end:
#    - script.execute: sound_beep
#    - delay: 160ms
#    - script.execute: sound_beep
#  on_intent_start:
#    - button.press: vibra_intent
  on_tts_start:
    - globals.set:
        id: va_capturing
        value: "false"
    - if:
        condition:
          lambda: 'return x == "${text_not_understood}";'
        then:
          - light.turn_on:
              id: leds
              red: 1
              green: 0
              blue: 0
              brightness: 1
              effect: "None"
#              effect: "Scan"
        else:
          - light.turn_on:
              id: leds
              effect: "None"
#              effect: "Rainbow"
              red: 0
              green: 1
              blue: 0
              brightness: 1
  on_tts_stream_end:
    - delay: 1s
    - script.execute: refresh_led_full_off_default
#    - repeat:
#        count: 2
#        then:
#          - button.press: vibra_intent
#          - delay: ${vibra_time_response_off}
#    - delay: 2s
#    - light.turn_off:
#        id: leds
#        transition_length: ${transition_length}
#    - delay: ${transition_length}
#    - script.execute: refresh_led_default
#  on_start:
#    - if:
#        condition:
#          - lambda: "return id(va).is_continuous();"
#        then:
#          - globals.set:
#              id: va_state
#              value: 'true'
#          - script.execute: refresh_led_default
  on_end:
    - if:
        condition:
          - lambda: "return id(va_capturing);"
        then:
          - globals.set:
              id: va_capturing
              value: "false"
          - globals.set:
              id: va_state
              value: 'false'
#          - delay: 2s
          - script.execute: refresh_led_full_off_default
    - if:
        condition:
          switch.is_on: use_wake_word
        then:
          - script.execute: micro_wake_word_start
#          - lambda: id(va).set_use_wake_word(true);
#          - voice_assistant.start_continuous:

  on_error:
    - script.execute: refresh_led_default
#    - light.turn_on:
#        id: leds
#        red: 1
#        green: 0
#        blue: 0
#    - delay: 2s
#    - light.turn_off: leds

#  on_client_connected:
#    - if:
#        condition:
#          switch.is_on: use_wake_word
#        then:
#          - voice_assistant.start_continuous:
#          - script.execute: reset_led
#  on_client_disconnected:
#    - if:
#        condition:
#          switch.is_on: use_wake_word
#        then:
#          - voice_assistant.stop:
##          - light.turn_off: leds

script:
  - id: micro_wake_word_start
    then:
      - micro_wake_word.start
      - globals.set:
          id: va_state
          value: 'true'
      - script.execute: refresh_led_default

  - id: sound_beep
    then:
      - if:
          condition:
            not:
              - speaker.is_playing
#                  id: external_speaker
          then:
            - lambda: id(audio_out).start();
            - delay: 50ms
            - lambda: id(audio_out).play(wake_word_triggered, wake_word_triggered_len);
            - wait_until:
                not:
                  speaker.is_playing

  - id: sound_key_click
