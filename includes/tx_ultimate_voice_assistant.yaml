micro_wake_word:
#  model: okay_nabu
  id: mww
  models:
    - model: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241205.4/okay_nabu.json
#      id: okay_nabu
#    - model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
#      id: stop
#      internal: true
#  vad:
#    model: https://github.com/kahrendt/microWakeWord/releases/download/v2.1_models/vad.json
  microphone: asr_mic
  on_wake_word_detected:
    - script.execute: sound_beep
#    - micro_wake_word.stop
    - voice_assistant.start:
        wake_word: !lambda return wake_word;
    - light.turn_on:
        id: leds
        red: 0
        green: 0
        blue: 1
        brightness: 1
#        effect: "Scan"
#  vad:
#    model: https://github.com/esphome/micro-wake-word-models/raw/main/models/v2/vad.json

button:
  - id: vibra_intent
    platform: output
    output: vibra_output
    duration: ${vibra_time_response}
    internal: true
  - id: vibra_ww
    platform: output
    output: vibra_output
    duration: ${vibra_time_wake_word}
    internal: true

  - platform: template
    name: Start assistant
    id: start_assistant
    entity_category: config
    on_press:
      - if:
          condition:
            micro_wake_word.is_running
          then:
            - micro_wake_word.stop
            - wait_until:
                not:
                  micro_wake_word.is_running
      - voice_assistant.start
      - light.turn_on:
          id: leds
          red: 0
          green: 0
          blue: 1
          brightness: 1
#          effect: "Scan"
#      - if:
#          condition:
#            - switch.is_on: use_wake_word
#          then:
#            - wait_until:
#                condition:
#                  not:
#                    - voice_assistant.is_running
#                timeout: 30s
#            - lambda: id(va).set_use_wake_word(true);
#            - voice_assistant.start_continuous
  - platform: template
    name: Test speaker
    id: test_speaker
    entity_category: config
    on_press:
      - script.execute: sound_beep

globals:
  - id: !extend ww_switch
    initial_value: use_wake_word
    restore_value: no
  - id: !extend start_assistant_button
    type: template_::TemplateButton*
    initial_value: start_assistant
    restore_value: no

switch:
  - platform: template
    name: Use wake word
    id: use_wake_word
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - globals.set:
          id: wakeword_enabled
          value: 'true'
      - micro_wake_word.start
      - delay: 250ms
      - script.execute: refresh_led_default

    on_turn_off:
      - globals.set:
          id: wakeword_enabled
          value: 'false'
      - micro_wake_word.stop
      - delay: 250ms
      - script.execute: refresh_led_default


i2s_audio:
  - id: audio_mic_i2s
    i2s_lrclk_pin: ${mic_lrclk_pin}
    i2s_bclk_pin: ${mic_bclk_pin}
  - id: audio_i2s
    i2s_lrclk_pin: ${audio_lrclk_pin}
    i2s_bclk_pin: ${audio_bclk_pin}

speaker:
  - id: audio_out
    platform: i2s_audio
    dac_type: external
    i2s_dout_pin: ${audio_sdata_pin}
    i2s_audio_id: audio_i2s
    i2s_comm_fmt: stand_msb
    timeout: 100ms
    channel: mono
    bits_per_sample: 16bit
    sample_rate: 16000
    buffer_duration: 1500ms

number:
  - name: Speaker Volume
    id: volume
    platform: template
    entity_category: config
    min_value: 0
    max_value: 1.0
    step: 0.05
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 0.85
    on_value:
      - lambda: id(audio_out).set_volume(x);

microphone:
  - platform: i2s_audio
    i2s_audio_id: audio_mic_i2s
    i2s_din_pin: ${mic_sdata_pin}
    adc_type: external
    id: asr_mic
    pdm: false


voice_assistant:
  id: va
  microphone: asr_mic
  speaker: audio_out
  use_wake_word: false
  noise_suppression_level: 4
  auto_gain: 31dBFS
  volume_multiplier: 15.0
  on_stt_vad_start:
    - globals.set:
        id: suspend_refresh
        value: "true"
    - light.turn_on:
        id: leds
        red: 0
        green: 1
        blue: 0
        brightness: 1
#        effect: "Scan"
  on_client_connected:
    then:
      - script.execute: restore_wake_word

  on_tts_start:
    - if:
        condition:
          lambda: 'return x == "${text_not_understood}";'
        then:
          - light.turn_on:
              id: leds
              red: 1
              green: 0
              blue: 0
              brightness: 1
              effect: "None"
#              effect: "Scan"
        else:
          - light.turn_on:
              id: leds
              effect: "None"
#              effect: "Rainbow"
              red: 0
              green: 1
              blue: 0
              brightness: 1
#  on_tts_stream_end:
#    - globals.set:
#        id: suspend_refresh
#        value: "false"
#    - script.execute: refresh_led_default

  on_end:
    - globals.set:
        id: suspend_refresh
        value: "false"
    - script.execute: restore_wake_word

  on_error:
    - globals.set:
        id: suspend_refresh
        value: "false"
    - script.execute: restore_wake_word

script:
  - id: restore_wake_word
    then:
      - if:
          condition:
            switch.is_on: use_wake_word
          then:
            - micro_wake_word.start
          else:
            - micro_wake_word.stop
      - delay: 250ms
      - script.execute: refresh_led_default


  - id: sound_beep
    then:
      - if:
          condition:
            not:
              - speaker.is_playing
          then:
            - lambda: id(audio_out).start();
            - delay: 50ms
            - lambda: id(audio_out).play(wake_word_triggered, wake_word_triggered_len);


