micro_wake_word:
#  model: okay_nabu
  id: mww
  models:
    - model: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241205.4/okay_nabu.json
#      id: okay_nabu
#    - model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
#      id: stop
#      internal: true
#  vad:
#    model: https://github.com/kahrendt/microWakeWord/releases/download/v2.1_models/vad.json
  microphone: asr_mic
  on_wake_word_detected:
    - script.execute: sound_beep
#    - micro_wake_word.stop
    - voice_assistant.start:
        wake_word: !lambda return wake_word;
    - light.turn_on:
        id: leds
        red: 0
        green: 0
        blue: 1
        brightness: 1
#        effect: "Scan"
#  vad:
#    model: https://github.com/esphome/micro-wake-word-models/raw/main/models/v2/vad.json

button:
  - id: vibra_intent
    platform: output
    output: vibra_output
    duration: ${vibra_time_response}
    internal: true
  - id: vibra_ww
    platform: output
    output: vibra_output
    duration: ${vibra_time_wake_word}
    internal: true

  - platform: template
    name: Start assistant
    id: start_assistant
    entity_category: config
    on_press:
      - if:
          condition:
            micro_wake_word.is_running
          then:
            - micro_wake_word.stop
            - wait_until:
                not:
                  micro_wake_word.is_running
      - globals.set:
          id: va_capturing
          value: "true"
      - voice_assistant.start
      - light.turn_on:
          id: leds
          red: 0
          green: 0
          blue: 1
          brightness: 1
#          effect: "Scan"
#      - if:
#          condition:
#            - switch.is_on: use_wake_word
#          then:
#            - wait_until:
#                condition:
#                  not:
#                    - voice_assistant.is_running
#                timeout: 30s
#            - lambda: id(va).set_use_wake_word(true);
#            - voice_assistant.start_continuous
  - platform: template
    name: Test speaker
    id: test_speaker
    entity_category: config
    on_press:
      - script.execute: sound_beep

globals:
  - id: !extend ww_switch
    initial_value: use_wake_word
    restore_value: no
  - id: !extend start_assistant_button
    type: template_::TemplateButton*
    initial_value: start_assistant
    restore_value: no

  - id: va_capturing
    type: bool
    initial_value: 'false'
    restore_value: no

switch:
  - platform: template
    name: Use wake word
    id: use_wake_word
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: config
    on_turn_on:
      - script.execute: micro_wake_word_start

#      - if:
#          condition:
#            not:
#              - voice_assistant.is_running
#          then:
#            - voice_assistant.start_continuous
##            - light.turn_on:
##                id: leds_wakeword
##                brightness: !lambda "return id(va_color)[3]/100.0;"
##                red: !lambda "return id(va_color)[0]/100.0;"
##                green: !lambda "return id(va_color)[1]/100.0;"
##                blue:  !lambda "return id(va_color)[2]/100.0;"
##     - script.execute: reset_led
    on_turn_off:
      - micro_wake_word.stop
#      - voice_assistant.stop
      # - lambda: id(va).set_use_wake_word(false);
      - globals.set:
          id: va_state
          value: 'false'
      - script.execute: refresh_led_default



