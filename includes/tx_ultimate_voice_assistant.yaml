i2s_audio:
  - id: audio_mic_i2s
    i2s_lrclk_pin: ${mic_lrclk_pin}
    i2s_bclk_pin: ${mic_bclk_pin}
  - id: audio_i2s
    i2s_lrclk_pin: ${audio_lrclk_pin}
    i2s_bclk_pin: ${audio_bclk_pin}

speaker:
  - id: audio_out
    platform: i2s_audio
    dac_type: external
    i2s_dout_pin: ${audio_sdata_pin}
    i2s_audio_id: audio_i2s
    i2s_comm_fmt: stand_msb
    timeout: 100ms
    channel: mono
    bits_per_sample: 16bit
    sample_rate: 8000
    buffer_duration: 1500ms

number:
  - name: Speaker Volume
    id: volume
    platform: template
    entity_category: config
    min_value: 0
    max_value: 2.0
    step: 0.05
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 0.85
    on_value:
      - lambda: id(audio_out).set_volume(x);

microphone:
