globals:  
  - id: wakeword_leds_array
    type: std::vector<int>
    initial_value: 'std::vector<int>{24,25}'
  - id: timer_leds_array
    type: std::vector<int>
    initial_value: 'std::vector<int>{14,15}'
  - id: suspend_refresh
    type: bool
    initial_value: 'false'
    restore_value: no
    
light:
#  - platform: neopixelbus
#    variant: WS2811
#    type: GRB
#    method:
#      type: esp32_rmt
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    chipset: ws2812
#    rmt_channel: 1
    use_psram: true

    pin: ${led_pin}
    num_leds: 32
    name: "Leds"
    id: leds
    default_transition_length: ${transition_length}
    effects:
      - addressable_rainbow:
          name: "Rainbow"
          speed: 30
          width: 8
      - pulse:
          name: "Pulse"
          transition_length: 500ms
          update_interval: 500ms
      - pulse:
          name: "Pulse-Slow"
          transition_length: 1000ms
          update_interval: 1000ms
      - pulse:
          name: "Pulse-Fast"
          transition_length: 500ms
          update_interval: 500ms
      - addressable_scan:
          name: "Scan"
          move_interval: 100ms
          scan_width: 3

script:
  - id: touch_led_feedback
    parameters:
      index: int
    then:
      - if:
          condition:
            switch.is_on: relays_light
          then:
            - lambda: |-
                auto light = ((AddressableLight*)id(leds).get_output());
                Color c(
                  (id(touch_color)[0] / 100.0) * ((id(touch_color)[3] / 100.0)  * 255), 
                  (id(touch_color)[1] / 100.0) * ((id(touch_color)[3] / 100.0)  * 255), 
                  (id(touch_color)[2] / 100.0) * ((id(touch_color)[3] / 100.0)  * 255)
                );

                for (int &l : id(leds_array)[index])
                {
                  light->get(l).set(c);
                }
                light->schedule_show();

  - id: refresh_led_default
    mode: restart
    then:
      - if:
          condition:
            not:
              lambda: return id(suspend_refresh);
          then:
            - if:
                condition:
                  and:
                    - light.is_on: leds
                    - lambda: return (id(leds)->get_effect_name() != "None");
                then:
                  - light.turn_on:
                      id: leds
                      effect: "None"
#                  - light.turn_on:
#                      id: leds
                      brightness: 1%
                  - delay: ${transition_length}
                  - wait_until:
                      condition:
                        lambda: return ((id(leds)->get_effect_name() == "None") && (! id(leds)->is_transformer_active()));
                      timeout: 1s
#                  - light.turn_on:
#                      id: leds
#                      # transition_length: 0ms
#                      effect: "None"
#                      brightness: 50%
            - lambda: |-
                ESP_LOGI("custom", "Refreshing leds");
                auto light = ((AddressableLight*)id(leds).get_output());

                for (int i = 0; i < id(relay_count); i++) {
                  Color c(0,0,0);

                  if ( (id(relay_states)[i]) && (id(relays_light).state)) {
                    /* Relay on feedback */
                    c = Color(
                      (id(button_color)[0] / 100.0) * ((id(button_color)[3] / 100.0)  * 255), 
                      (id(button_color)[1] / 100.0) * ((id(button_color)[3] / 100.0)  * 255), 
                      (id(button_color)[2] / 100.0) * ((id(button_color)[3] / 100.0)  * 255)
                      );

                  } else {
                    
                    if (id(night_light_active).state) {
                      /* Night light active */
                      c = Color(
                        (id(nightlight_color)[0]) / 100.0 * ((id(nightlight_color)[3] / 100.0)  * 255), 
                        (id(nightlight_color)[1]) / 100.0 * ((id(nightlight_color)[3] / 100.0)  * 255), 
                        (id(nightlight_color)[2]) / 100.0 * ((id(nightlight_color)[3] / 100.0)  * 255)
                      );
                    }
                  }

                  ESP_LOGI("custom", "Settings %d/%d/%d for leds of %d", c.red,c.green,c.blue, i);
                  for (int &l : id(leds_array)[i])
                  {
                    light->get(l).set(c);
                  }
                }
                if (id(wakeword_enabled)) {
                  /* Wakeword led */
                  Color c(
                    (id(va_color)[0] / 100.0) * ((id(va_color)[3] / 100.0)  * 255), 
                    (id(va_color)[1] / 100.0) * ((id(va_color)[3] / 100.0)  * 255), 
                    (id(va_color)[2] / 100.0) * ((id(va_color)[3] / 100.0)  * 255)
                  );
                  ESP_LOGI("custom", "Settings %d/%d/%d for leds for wakeword", c.red,c.green,c.blue);

                  for (int &l : id(wakeword_leds_array))
                  {
                    light->get(l).set(c);
                  }
                }

                #ifdef USE_VOICE_ASSISTANT
                
                if (va->get_timers().size() > 0) {
                  /* One or more Timers schedulated */
                  Color c(
                    (id(timer_active_color)[0] / 100.0) * ((id(timer_active_color)[3] / 100.0)  * 255), 
                    (id(timer_active_color)[1] / 100.0) * ((id(timer_active_color)[3] / 100.0)  * 255), 
                    (id(timer_active_color)[2] / 100.0) * ((id(timer_active_color)[3] / 100.0)  * 255)
                  );
                  ESP_LOGI("custom", "Settings %d/%d/%d for leds for timer", c.red,c.green,c.blue);

                  for (int &l : id(timer_leds_array))
                  {
                    light->get(l).set(c);
                  }

                }

                #endif

                light->schedule_show();
          else:
            - lambda: ESP_LOGI("custom", "Leds refresh disabled");
