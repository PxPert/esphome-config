esphome:
  name: selettorehifi
  friendly_name: Selettore HiFi
#  platformio_options:
#    board_build.ldscript: eagle.flash.4m.ld
  on_boot:
    - priority: 250
      then:
        - script.execute: show_display

esp8266:
  board: esp12e

# Enable logging
logger:
  level: DEBUG
#  level: NONE
  baud_rate: 115200

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  password: !secret ota_pwd
  id: my_ota
  platform: esphome

wifi:
  ssid: !secret wifi_dmz_ssid
  password: !secret wifi_dmz_password
  use_address: 192.168.2.106

mdns:
  disabled: true

mqtt:
  id: mqtt_client
  broker: !secret mqtt_server
  username: !secret mqtt_user
  password: !secret mqtt_pwd
  discovery: false
# #   client_id: cd_reader
# # #  log_topic: null

    
i2c:
  scan: True
  frequency: 100kHz
#  sda: GPIO5
#  scl: GPIO4

font:
#   - file: "gfonts://Roboto"
    # id: roboto_20
    # size: 20
#  - file: 'fonts/LiberationMono-Regular.ttf'
#    id: font_header
#    size: 14

  - file: 'fonts/LiberationMono-Regular.ttf'
    id: font_body
    size: 24
    # webfonts from https://pictogrammers.com/
  - file: 'fonts/materialdesignicons-webfont.ttf'
    id: md_state_icons
    size: 32
    glyphs:
      - "\U000F07F4" # TV
      - "\U000F0960" # HiFi
#      - "\U000" # 


display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x32"
    address: 0x3C
    id: lcd_display
    update_interval: never
#    show_test_card: true
    lambda: |-
      if ( ! ( id(display_on))  ) {
        return;
      }

      // Icon
      if (id(selected_tv_mode)) {
        it.printf(0, 0, id(md_state_icons), TextAlign::TOP_LEFT,"\U000F07F4");
        it.printf(64, 4, id(font_body), TextAlign::TOP_LEFT,"TV");
      } else {
        it.printf(0, 0, id(md_state_icons), TextAlign::TOP_LEFT,"\U000F0960");
        it.printf(50, 4, id(font_body), TextAlign::TOP_LEFT,"HiFi");
      }


