sensor:
  - platform: template
    id: rc5_in_data
    name: "RC5 in data"
    update_interval: never

  - platform: template
    id: rc5_in_rep_id
    name: "RC5 in repetition id"
    update_interval: never

number:
  - platform: template
    id: rc5_data
    name: "RC5 out data"
    min_value: 0
    max_value: 4294967295
    step: 1
    mode: box
    optimistic: True
    restore_value: False
    initial_value: 0
  - platform: template
    id: rc5_repeats
    name: "RC5 out repetitions"
    mode: box
    min_value: 1
    max_value: 255
    step: 1
    optimistic: True
    restore_value: False
    initial_value: 0
