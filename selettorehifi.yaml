external_components:
  - source: /config/components/
    components: [ rc5x ]

rc5x:
  id: marantz_remote
  receive_pin: 13
  invert_receive_pin: true
  send_pin: 12
  on_press:
    lambda: |-
      ESP_LOGD("rc5x-yaml","IR Press From yaml. %d - %lu", t,x);
      id(rc5_in_data).publish_state(x);
      id(rc5_in_rep_id).publish_state(t);


binary_sensor:
  - platform: gpio
    internal: True
    name: "Selector button"
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
#      inverted: True
    on_press:
      then:
        - if:
            condition: 
              lambda: |-
                return id(display_on);
            then:
            - globals.set:
                id: selected_tv_mode
                value: !lambda 'return 1 - id(selected_tv_mode);'
        - script.execute: show_display
        - script.execute: set_selection_mode

globals:
  - id: selected_tv_mode
    type: bool
    restore_value: no
    initial_value: '0'
  - id: display_on
    type: bool
    initial_value: 'false'
    restore_value: no

switch:
  - platform: gpio
    pin: GPIO15
    id: tv_mode
    name: "Tv Mode"
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.stop: set_selection_mode
      - globals.set:
          id: selected_tv_mode
          value: '1'
      - script.execute: show_display

    on_turn_off:
      - script.stop: set_selection_mode
      - globals.set:
          id: selected_tv_mode
          value: '0'
      - script.execute: show_display

script:
  - id: set_selection_mode
    mode: restart
    then:
      - delay: 2s
      - lambda: |-
          if (id(selected_tv_mode)) {
            id(tv_mode).turn_on();
          } else {
            id(tv_mode).turn_off();
          }

  - id: show_display
    mode: restart
    then:
      - globals.set:
          id: display_on
          value: 'true'
      - component.update: lcd_display
      - delay: 10s
      - globals.set:
          id: display_on
          value: 'false'
      - component.update: lcd_display

button:
  - platform: safe_mode
    name: "Selettore Hi-IF Restart (Safe Mode)"
  - platform: restart
    name: "Selettore Hi-IF Restart"
  - platform: template
    name: "Send RC5"
    on_press: 
      then:
        - lambda: |-
            // id(marantz_remote).send_rc5x(16,12,2,1);
            // id(marantz_remote).send_rc5x(1051650,1);
            id(marantz_remote).send_rc5(id(rc5_data).state,id(rc5_repeats).state);

  - platform: template
    name: "Send RC5x"
    on_press: 
      then:
        - lambda: |-
            // id(marantz_remote).send_rc5x(16,12,1,1);
            // id(marantz_remote).send_rc5x(1051649,1);
            id(marantz_remote).send_rc5x(id(rc5_data).state,id(rc5_repeats).state);

# output:
