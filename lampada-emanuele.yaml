# Basic Config
substitutions:
  friendly_name: Lampada Emanuele
  device_name: lampada-emanuele

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp8266:
  board: esp8285

logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_pwd_sec

wifi:
  ssid: !secret wifi_dmz_ssid
  password: !secret wifi_dmz_password
  use_address: 192.168.2.73

mqtt:
  id: mqtt_client
  broker: !secret mqtt_server
  username: !secret mqtt_user
  password: !secret mqtt_pwd
  discovery: false
  client_id: ${device_name}

packages:
  # Log su loki
  syslog: !include includes/syslog.yaml


# Device Specific Config
binary_sensor:
  - platform: gpio
    id: push_button
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: True
    internal: true
    on_press:
      # Prevents unintended LED lit states.
      light.toggle: luce

light:
  - platform: status_led
    id: blue_led
    internal: True
    pin:
      number: GPIO13
      inverted: True
      
  # The relay switches on the red side of the LED when active.
  - platform: binary
    name: "Luce"
    id: luce
    output: relay_output
    on_turn_on: 
      then:
        - light.turn_on: blue_led
    on_turn_off:
      then:
        - light.turn_off: blue_led
output:
  - platform: gpio
    id: relay_output
    pin: GPIO12