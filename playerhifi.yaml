substitutions:
  friendly_name: Player HiFi
  device_name: player-hifi

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

psram:
  mode: quad
  speed: 80MHZ
  ignore_not_found: true
  
mdns:
  disabled: true
  
debug:
  update_interval: 10s
  
esp32:
  board: esp-wrover-kit
#  partitions: partition_layouts/huge_app_esp32.csv
  cpu_frequency: 240MHZ
  
  framework:
    type: esp-idf
    version: 6.0.2
#    version: 6.1-beta1
    advanced:
      enable_ota_rollback: false
      sram1_as_iram: true
    sdkconfig_options: 
      # Disabilita il protocollo SSL/TLS (mantiene solo le primitive crypto per WiFi)
#      CONFIG_MBEDTLS_TLS_DISABLED: y
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE: n
#      CONFIG_MBEDTLS_TLS_SERVER_AND_CLIENT: n
#      CONFIG_MBEDTLS_KEY_EXCHANGE_RSA: y
#      CONFIG_MBEDTLS_KEY_EXCHANGE_ELLIPTIC_CURVE: n
#      CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA: y
#      CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA: n
#      CONFIG_MBEDTLS_KEY_EXCHANGE_ECDH_ECDSA: n
#      CONFIG_MBEDTLS_KEY_EXCHANGE_ECDH_RSA: n
      CONFIG_MBEDTLS_SSL_ALPN: n
      CONFIG_MBEDTLS_SSL_RENEGOTIATION: n
      CONFIG_MBEDTLS_CLIENT_SSL_SESSION_TICKETS: n
      CONFIG_MBEDTLS_SERVER_SSL_SESSION_TICKETS: n
      CONFIG_MBEDTLS_PEM_PARSE_C: n
      CONFIG_MBEDTLS_PEM_WRITE_C: n
      CONFIG_MBEDTLS_X509_CRL_PARSE_C: n
      CONFIG_MBEDTLS_X509_CSR_PARSE_C: n
      CONFIG_ESP_HTTP_CLIENT_ENABLE_HTTPS: n
  

wifi:
  power_save_mode: none
  ssid: !secret wifi_dmz_ssid
  password: !secret wifi_dmz_password
    
logger:
  hardware_uart: UART0
  level: DEBUG
  
  baud_rate: 115200
  task_log_buffer_size: 0
  tx_buffer_size: 160

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_pwd_sec

external_components:
  - source: github://PxPert/a2dp_sink@master
    components: [ a2dp_sink ]
  - source: esphome-git/esphome/components
    components: [ i2s_audio ]
#    refresh: never
  
sendspin:
  task_stack_in_psram: true

a2dp_sink:
  name: HiFiPlayer
  minimal_bluetooth: true
  on_playback_position:
    then:
      - lambda: id(co_progress).publish_state(pos);
  on_metadata:
    then:
      - logger.log:
          format: "Metadata type %d: %s"
          args: [type, text.c_str()]
      - lambda: |- 
          switch (type) {
            case (int)a2dp_sink::A2DPSinkMetadataTypes::TITLE:
              id(co_title).publish_state(text);
              break;
            case (int)a2dp_sink::A2DPSinkMetadataTypes::ARTIST:
              id(co_artist).publish_state(text);
              break;
            case (int)a2dp_sink::A2DPSinkMetadataTypes::ALBUM:
              id(co_album).publish_state(text);
              break;
            case (int)a2dp_sink::A2DPSinkMetadataTypes::PLAYINGTIME:
              float value = 0.0f;
              if (sscanf(text.c_str(), "%f", &value) == 1) {
                id(co_duration).publish_state(value);
              }
              break;
          }
          
i2s_audio:
  - id: i2s_spdif
    
speaker:
  - platform: i2s_audio
    id: speaker_spdif
    dac_type: external
    channel: stereo
    use_apll: true
    sample_rate: 48000
    i2s_dout_pin: GPIO32
    spdif_mode: true
    timeout: 1s
    buffer_duration: 30ms
#  - platform: resampler
#    output_speaker: speaker_spdif
#    sample_rate: 48000
#    task_stack_in_psram: true
#    id: speaker_resampler
#    buffer_duration: 100ms
    

media_source:
  - platform: sendspin
    id: media_source_sendspin
    static_delay_adjustable: true
    buffer_size: 350000
#  - platform: audio_http
#    id: media_source_http
#    buffer_size: 16000
  - platform: a2dp_sink
    id: media_source_bluetooth
    
media_player:    
  - platform: speaker_source
    id: external_media_player
    name: Media Player
    media_pipeline:
      format: FLAC
      num_channels: 2
      sample_rate: 48000
#      speaker: speaker_resampler
      speaker: speaker_spdif
      sources:
        - media_source_sendspin
        - media_source_bluetooth
#        - media_source_http
    on_state:
      - then: 
        - lambda: |-
            if (id(external_media_player).state  == media_player::MEDIA_PLAYER_STATE_PLAYING) {
              if (id(media_source_bluetooth).get_state() == media_source::MediaSourceState::PLAYING) {
                id(co_source_type).publish_state(1);
              } else if (id(media_source_sendspin).get_state() == media_source::MediaSourceState::PLAYING) {
                id(co_source_type).publish_state(2);
              } else {
                id(co_source_type).publish_state(0);
              }              
            } else {
              id(co_source_type).publish_state(0);
            }
          
font:
  - file: "fonts/Roboto-Regular.ttf"
    id: font_header
    size: 14
    glyphs: "abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ.-,+/°:() "
  - file: "fonts/Roboto-Light.ttf"
    id: font_light
    size: 24
    glyphs: "abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ.-,+/°:() "
  - file: "fonts/Roboto-Condensed.ttf"
    id: font_condensed
    size: 16
    glyphs: "abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ.-,+/°:() "
   
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: md_state_icons
    size: 40
    glyphs:
      - "\U000F040A" # play
      - "\U000F03E4" # pause
      - "\U000F04DB" # stop
        
number:
  - platform: a2dp_sink
    name: "Bluetooth Volume"

    
switch:
  - platform: a2dp_sink
    type: connection
    name: "Bluetooth connection"
    id: "btConnection"
    restore_mode: ALWAYS_OFF

  - platform: a2dp_sink
    type: bluetooth
    name: "Bluetooth state"
    id: "btState"
    restore_mode: RESTORE_DEFAULT_OFF

    
button:
  - platform: template
    name: next
    on_press:
      - then:
          - media_player.next: external_media_player
  - platform: template
    name: previous
    on_press:
      - then:
          - media_player.previous: external_media_player
            
  - platform: restart
    name: "restart"
    id: button_restart_1

sensor:
  - platform: sendspin
    id: sp_progress
    internal: true
    type: track_progress
    on_value:
      - sensor.template.publish:
          id: co_progress
          state: !lambda 'return x;'
          
  - platform: sendspin
    id: sp_duration
    internal: true
    type: track_duration
    on_value:
      - sensor.template.publish:
          id: co_duration
          state: !lambda 'return x;'


          
  - platform: template
    id: co_progress
    name: "Song position"
    update_interval: never 
    internal: true
  - platform: template
    id: co_duration
    name: "Song duration"
  - platform: template
    id: co_source_type
    internal: true
    update_interval: never
    on_value:
      - text_sensor.template.publish:
          id: co_source
          state: !lambda 'return (x==0?"Stopped":(x==1?"Bluetooth":"Sendspin"));'
    
  - platform: debug
    free:
      name: Free
    fragmentation:
      name: Fragmentation

text_sensor:
  - platform: sendspin
    type: artist
    id: sp_artist
    internal: true
    on_value:
      then:
      - text_sensor.template.publish:
          id: co_artist
          state: !lambda 'return x;'
          
  - platform: sendspin
    type: album
    name: "Album"
    id: sp_album
    internal: true
    on_value:
      then:
      - text_sensor.template.publish:
          id: co_album
          state: !lambda 'return x;'
  - platform: sendspin
    type: title
    name: "Title"
    id: sp_title
    internal: true
    on_value:
      then:
      - text_sensor.template.publish:
          id: co_title
          state: !lambda 'return x;'

  - platform: template
    name: "Artist"
    update_interval: never
    icon: "mdi:account"
    id: co_artist
  - platform: template
    name: "Album"
    update_interval: never
    icon: "mdi:disc"
    id: co_album
  - platform: template
    name: "Title"
    update_interval: never
    id: co_title
    icon: "mdi:music-note"
  - platform: template
    name: "Source"
    update_interval: never
    id: co_source
    icon: "mdi:source-fork"
    
    
# --- I2C Bus ---
i2c:
  sda: GPIO19
  scl: GPIO18
  frequency: 100kHz
  scan: false

# --- Display OLED SSD1306 ---
display:
  - platform: ssd1306_i2c
    model: SSD1306_128X64
    address: 0x3C
    lambda: |-
      // Icon
      const char* status_icon = "\U000F04DB"; // Stop icon
      if (id(external_media_player).state  == media_player::MEDIA_PLAYER_STATE_PLAYING) {
        status_icon = "\U000F040A"; // Play icon
      } else if (id(external_media_player).state  == media_player::MEDIA_PLAYER_STATE_PAUSED) {
        status_icon = "\U000F03E4"; // Pause icon
      }
      it.printf(0, 22, id(md_state_icons), TextAlign::TOP_LEFT,status_icon);

      it.print(0, 0, id(font_header), id(co_source).state.c_str());

      if (
          (id(external_media_player).state == MEDIA_PLAYER_STATE_PLAYING) 
          ||
          (id(external_media_player).state == MEDIA_PLAYER_STATE_PAUSED) 
          )
        {
        }


    flip_x: true
    flip_y: true

