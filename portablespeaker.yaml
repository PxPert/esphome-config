substitutions:
  friendly_name: Portable speaker
  device_name: portable-speaker
  
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp-wrover-kit
  flash_frequency: 80MHz
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 80MHZ
  ignore_not_found: true
  
logger:
  hardware_uart: UART0
  baud_rate: 115200
  
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_pwd_sec

i2c:
  - id: i2c_bus
    sda: GPIO18
    scl: GPIO23

wifi:
  ssid: !secret wifi_dmz_ssid
  password: !secret wifi_dmz_password


external_components:
  - source: github://pr#3552 # DAC support https://github.com/esphome/esphome/pull/3552
    components: [es8388]
    refresh: 0s
  - source: github://jesserockz/esphome-components
    components: [file]
  - source: github://pr#7672
    components:
      - audio
      - speaker
      - i2s_audio
      - speaker
    refresh: 0s
  - source: github://pr#5230
    components:
      - esp_adf
    refresh: 0s

    
es8388:

esp_adf:

globals:
  - id: wifi_connected
    type: bool
    initial_value: "false"
    restore_value: false

interval:
  - interval: 1s
    then:
      - if:
          condition:
            and:
              - lambda: "return !id(wifi_connected);"
              - wifi.connected:
          then:
            - globals.set:
                id: wifi_connected
                value: "true"
#            - light.turn_on:
#                id: top_led
#                effect: pulse
#                red: 0%
#                green: 100%
#                blue: 0%
#            - delay: 1s
#            - light.turn_off: top_led
#
#output:
#  - platform: gpio
#    id: dac_mute
#    pin: GPIO21
#    inverted: true
#
i2s_audio:
  - id: i2s_mic
    i2s_lrclk_pin: 
      number: GPIO25
#      allow_other_uses: true
    i2s_bclk_pin: 
      number: GPIO5
#      allow_other_uses: true

#  - id: i2s_spk
#    i2s_lrclk_pin: 
#      number: GPIO25
#      allow_other_uses: true
#    i2s_bclk_pin: 
#      number: GPIO5
#      allow_other_uses: true

speaker:
  - platform: i2s_audio
#    i2s_audio_id: i2s_spk
    id: board_external_speakers
    dac_type: external
    i2s_dout_pin: GPIO26
    channel: mono
    sample_rate: 44100
#    mute_pin:
#      number: GPIO21
#      inverted: true

#microphone:
#  - platform: nabu_microphone
#    id: master_microphone
#    i2s_din_pin: GPIO35
#    adc_type: external
#    pdm: false
#    channel_0:
#      id: luxe_microphone
#      amplify_shift: 0

microphone:
  - platform: i2s_audio
#    i2s_audio_id: i2s_mic
    id: luxe_microphone
    i2s_din_pin: GPIO35
    adc_type: external
    pdm: false

media_player:
  - platform: speaker
    id: nabu_media_player
    name: Media Player
    internal: false
    speaker: board_external_speakers
    sample_rate: 44100
    volume_increment: 0.05
    volume_min: 0.4
    volume_max: 0.85

