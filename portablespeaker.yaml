microphone:
  - platform: i2s_audio
    id: luxe_microphone
    i2s_audio_id: i2s_audio_bus
    sample_rate: 16000
    i2s_din_pin: GPIO35
    bits_per_sample: 16bit
    channel: stereo
    adc_type: external  

sendspin:
  id: sendspin_hub
  task_stack_in_psram: true

a2dp_sink:
  name: MuseLuxe
  minimal_bluetooth: true
  
switch:
  - platform: gpio
    id: amplifier_enable
    pin:
      number: GPIO21
#      inverted: true
    restore_mode: ALWAYS_ON
    internal: true

  - platform: a2dp_sink
    type: connection
    name: "Bluetooth connection"
    id: "btConnection"
    restore_mode: ALWAYS_OFF

  - platform: a2dp_sink
    type: bluetooth
    name: "Bluetooth state"
    id: "btState"
    restore_mode: RESTORE_DEFAULT_OFF
    
light:
  - platform: esp32_rmt_led_strip
    name: None
    id: top_led
    pin: GPIO22
    chipset: SK6812
    num_leds: 1
    rgb_order: grb
    gamma_correct: 2.8
    effects:
      - pulse:
          transition_length: 250ms
          update_interval: 250ms

button:
  - platform: restart
    name: "Restart"
    id: button_restart
  - platform: template
    name: Start-Stop assistant
    id: start_assistant
    entity_category: config
    on_press:
      - if:
          condition:
            voice_assistant.is_running
          then:
            - voice_assistant.stop
          else:
            - script.execute: start_assistant_script

  - platform: template
    name: Force play
    id: force_sendspin
    entity_category: config
    on_press:
      then:
        - media_player.play_media:
            id: external_media_player
            media_url: sendspin://current
        

#audio_file:
#  - id: ready_sound
#    file: https://github.com/RealDeco/xiaozhi-esphome/raw/main/sounds/${startup_sound_file}.flac
    
media_source:
#  - platform: audio_file
#    id: audio_file_announcement_source
#  - platform: audio_http
#    id: http_announcement_source
  - platform: audio_http
    id: http_media_source
  - platform: sendspin
    id: media_source_sendspin
    decode_memory: internal
  - platform: a2dp_sink
    id: media_source_bluetooth
    
media_player:
  - platform: sendspin
    id: sendspin_media_player
  - platform: speaker_source
    id: external_media_player
    name: none

#    announcement_pipeline:
#      format: FLAC
#      num_channels: 1
#      sample_rate: 48000
#      speaker: announcement_resampling_speaker
#      sources:
#        - http_announcement_source
    announcement_pipeline:
      format: FLAC
      num_channels: 2
      sample_rate: 48000
      speaker: luxe_speaker
      sources:
        - http_media_source
        - media_source_sendspin
        - media_source_bluetooth
    volume_increment: 0.05
    volume_min: 0.4
    volume_max: 0.9
    on_state:
      - then: 
        - logger.log:
            format: "New mediaplayer state: %d"
            args: [id(external_media_player).state]
        - if: 
            condition:
              lambda: |-
                return (              
                  (id(external_media_player).state  == media_player::MEDIA_PLAYER_STATE_PLAYING)
                  ||
                  (id(external_media_player).state  == media_player::MEDIA_PLAYER_STATE_PAUSED)
                );
            then:
              - if:
                  condition:
                    lambda: "return (id(media_source_bluetooth).get_state() == media_source::MediaSourceState::PLAYING);"
                  then:
                    - lambda: "id(source_type) = 1;"
                  else:
                    - lambda: "id(source_type) = 2;"
                    - switch.turn_off: btState
            else:
              - lambda: "id(source_type) = 0;"
              - switch.turn_on: btState
      
voice_assistant:
  id: va
  microphone:
    - microphone: luxe_microphone
  media_player: external_media_player
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0

  on_listening:
    then:
      - logger.log: "IS LISTENING!!"

  on_end:
    - wait_until:
        condition:
          media_player.is_announcing:
            id: external_media_player
        timeout: 0.5s
    - wait_until:
        - and:
            - not:
                media_player.is_announcing:
                  id: external_media_player
            - not:
                speaker.is_playing:
                  id: luxe_speaker
    - media_player.play: 
        id: sendspin_media_player
                  
sensor:
  - platform: adc
    id: battery_sensor
    pin: GPIO33
    name: Battery
    icon: "mdi:battery-outline"
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    unit_of_measurement: V
    update_interval: 15s
    accuracy_decimals: 3
    attenuation: 11db
    raw: true
    filters:
      - multiply: 0.00173913  # 2300 -> 4, for attenuation 11db, based on Olivier's code
      - exponential_moving_average:
          alpha: 0.2
          send_every: 2
      - delta: 0.002

binary_sensor:
  - platform: gpio
    internal: true
    pin:
      number: GPIO19
      inverted: true
      mode:
        input: true
        pullup: true
    name: Volume Up
    id: volume_up
    on_click:
      - media_player.volume_up:
          id: external_media_player
  - platform: gpio
    internal: true
    pin:
      number: GPIO32
      inverted: true
      mode:
        input: true
        pullup: true
    name: Volume Down
    id: volume_down
    on_click:
      - media_player.volume_down:
          id: external_media_player
  - platform: gpio
    internal: true
    pin:
      number: GPIO12
      inverted: true
      mode:
        input: true
        pullup: true
    name: Action
    id: action_button
    on_multi_click:
      - timing:
          - ON FOR AT MOST 350ms
          - OFF FOR AT LEAST 10ms
        then:
          - media_player.toggle:
              id: external_media_player
      - timing:
          - ON FOR AT LEAST 350ms
        then:
          - script.execute: start_assistant_script
#      - timing:
#          - ON FOR AT LEAST 350ms
#          - OFF FOR AT LEAST 10ms
#        then:
#          - voice_assistant.stop:

script:
  id: start_assistant_script
  mode: single
  then:
    - if:
        condition:
          - speaker.is_playing:
              id: luxe_speaker
        then:
          - logger.log: "STOP PLAY!!"
          - if: 
              condition:
                  lambda: "return (id(media_source_bluetooth).get_state() == media_source::MediaSourceState::PLAYING);"
              then:
                - media_player.stop: 
                    id: external_media_player
              else:
                - media_player.pause: 
                    id: external_media_player
          - wait_until:
            - not:
              - speaker.is_playing:
                  id: luxe_speaker
    - voice_assistant.start: 