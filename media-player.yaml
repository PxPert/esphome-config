# Basic Config
substitutions:
  friendly_name: test-media-player
  device_name: test-media-player

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  libraries:
    - uFire BluetoothA2DPSink=https://github.com/pschatzmann/ESP32-A2DP
  platformio_options:
    build_flags: 
      - -include
      - ${PROJECT_DIR}/compat_delay.h
    
  includes:
    - includes/advanced_bt_component.h
#psram:
#  mode: quad
#  speed: 80MHZ
  
mdns:
  disabled: false

  
esp32:
  variant: esp32
  
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BT_ENABLED: y
      CONFIG_BT_CLASSIC_ENABLED: n
      CONFIG_BT_A2DP_ENABLE: n
      CONFIG_BT_SPP_ENABLED: n
      CONFIG_BT_BLUEDROID_ENABLED: n
      CONFIG_BT_NIMBLE_ENABLED: n
      CONFIG_BTDM_CTRL_MODE_BLE_ONLY: n
    version: 6.0.2
#    advanced:
#      sram1_as_iram: true
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
logger:
  hardware_uart: UART0
  level: DEBUG
  baud_rate: 115200

api:

ota:
  platform: esphome

external_components:
  - source: /config/components/
    components: [ a2dp_sink ]
    
#sendspin:
#  task_stack_in_psram: true
    
media_source:
  - platform: audio_http
    id: http_source
    buffer_size: 100000
    task_stack_in_psram: false
#  - platform: sendspin
#    fixed_delay: 1ms
#    id: sendspin_media_source
#    task_stack_in_psram: true
#    decode_memory: psram
#    buffer_size: 192000
#    static_delay_adjustable: true
  - platform: a2dp_sink
    id: bluetooth
  
media_player:
#  - platform: sendspin
#    id: sendspin_group_media_player
  - platform: speaker_source
    id: external_media_player
    name: Media Player
    media_pipeline:
      format: FLAC     # FLAC is the least processor intensive codec
      num_channels: 2
      sample_rate: 48000
      speaker: spdif_speaker
      sources:
#        - sendspin_media_source
        - http_source
        - bluetooth
  
#optional
#web_server:
#  port: 80

i2s_audio:
  - id: i2s_output

speaker:
  - platform: i2s_audio
    id: spdif_speaker
    dac_type: external
    i2s_audio_id: i2s_output
    i2s_dout_pin: GPIO25
    spdif_mode: true
    use_apll: true
    sample_rate: 48000
    channel: stereo
    timeout: 2s
    buffer_duration: 2s
    
  
sensor:

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 600s
#  - platform: sendspin
#    type: track
#    name: traccia
#    id: sensor_sendspin_1

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
#  - platform: sendspin
#    type: title
#    name: titolo
#    id: text_sensor_sendspin_1
#  - platform: sendspin
#    type: artist
#    name: artista
#    id: text_sensor_sendspin_2

button:
  - platform: restart
    name: "restart"
    id: button_restart_1
